<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .navbar {
      /* 使用Flexbox布局，使得三个子对象div处于同一行 */
      display: flex;
      height: 50px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
      /* 子对象垂直居中 */
      align-items: center;
    }

    .navbar-left {
      /* 左侧对齐 */
      margin-left: 10px;
    }

    .logo {
      /* 或 40px，根据实际需要调整 */
      height: 32px;
      /* 保持宽高比 */
      width: auto;
      /* 避免底部有空隙 */
      display: block;
    }

    .navbar-title {
      /* 标题距离左侧的距离 */
      margin-left: 0px;
    }

    .navbar-title-image {
      height: 20px;
      /* 保持宽高比 */
      width: auto;
      /* 避免底部有空隙 */
      display: block;
    }

    .navbar-center {
      /* 距离左侧的距离*/
      margin-left: 25px;
      /* navbar-center的父元素加了flex布局只影响直接的子元素，如果想要navbar-center的子元素也使用flex布局，需要单独设置 */
      display: flex;
      gap: 24px;
    }

    .nav-link {
      /* 去掉下划线，设置颜色和字体大小 */
      text-decoration: none;
      color: #333;
      font-size: 16px;
    }

    .nav-link:hover {
      /* 鼠标悬停时文字变粗 */
      font-weight: bold;
    }

    .navbar-right {
      /* 右侧对齐 */
      margin-left: auto;
      margin-right: 10px;
      display: flex;
      align-items: center;
    }

    .navbar-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 16px;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .navbar-user-info:hover {
      text-decoration: none;
      color: inherit;
      /* 放大效果 */
      transform: scale(1.1);
    }

    .user-tooltip {
      display: none;
      position: absolute;
      left: 50%;
      bottom: -32px;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 10;
      opacity: 0.9;
      pointer-events: none;
    }

    .navbar-user-info:hover .user-tooltip {
      display: block;
    }

    .navbar-user-icon {
      height: 32px;
      width: 32px;
      border-radius: 50%;
      display: block;
    }

    /* 选中项加粗+下方黑线 */
    .nav-link.navbar-active {
      font-weight: bold;
      position: relative;
    }

    .nav-link.navbar-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #000;
      bottom: -14px;
    }
  </style>
</head>

<body>
  <!--  提示框，代替alert -->
  <div id="toast"
    style="display:none;position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 32px;border-radius:6px;z-index:9999;font-size:16px;">
  </div>
  <nav class="navbar">
    <div class="navbar-left">
      <img src="../assets/logo.png" alt="Logo" class="logo">
    </div>
    <div class="navbar-title">
      <img src="../assets/title.jpg" alt="Title" class="navbar-title-image">
    </div>
    <div class="navbar-center">
      <a href="../htmls/create.html" class="nav-link navbar-create-center">创作</a>
      <a href="../htmls/square.html" class="nav-link">广场</a>
    </div>
    <div class="navbar-right">
      <a href="../htmls/user.html" class="navbar-user-info" style="text-decoration:none; color:inherit;">
        <img src="../assets/default-avatar.png" alt="User Icon" class="navbar-user-icon">
        <span class="username">用户名</span>
        <span class="user-tooltip">点击进入用户中心</span>
      </a>
      <a href="../htmls/login.html" class="nav-link">登录/注册</a>
    </div>
  </nav>
  <script>
  </script>
</body>

</html>
