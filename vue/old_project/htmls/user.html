<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="../js/ip.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* 字体无法选中 */
      user-select: none;
    }

    .body {
      background-color: #f5f5f5;
    }

    .user-main {
      margin: 20px auto;
      width: 80%;
      max-width: 2000px;
      min-width: 500px;
      height: 700px;
      /* background-color: #ecf0f3;
      box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
      border-radius: 12px; */

      display: grid;
      grid-template-columns: 330px 1fr;
      grid-template-rows: 500px 1fr;
      grid-template-areas:
        "card files"
        "visible files";
      gap: 0;
    }

    .user-basic-card {
      grid-area: card;
      width: 300px;
      height: 470px;
      background-color: #ecf0f3;
      box-shadow: 5px 5px 10px #d1d9e6, -5px -5px 10px #f9f9f9;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }


    .user-avatar {

      position: relative;
      cursor: pointer;
      display: inline-block;
    }

    .user-avatar img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 5px 5px 10px #d1d9e6, -5px -5px 10px #f9f9f9;
      transition: filter 0.3s;
      display: block;
    }

    .avatar-tip {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      left: 0;
      top: 0;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      color: #4b70e2;
      font-size: 13px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      text-align: center;
      white-space: pre-line;
      z-index: 2;
    }

    .user-avatar:hover .avatar-tip {
      opacity: 1;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 90%;
      gap: 4px;
    }

    .username-span {
      color: #b0b6be;
      font-size: 16px;
      font-weight: bold;
      margin-left: 0;
      letter-spacing: 0.5px;
    }

    .username-real {
      font-size: 16px;
      font-weight: bold;
      background-color: #e7e9eb;
      border-radius: 12px;
      height: 40px;
      width: 100%;
      font-size: 20px;
      /* 文字内容垂直居中 */
      display: flex;
      align-items: center;
      /* 使得文字内容向右移动 */
      padding-left: 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    .user-btn-edit {
      width: 82%;
      height: 40px;
      border: none;
      border-radius: 20px;
      background-color: #4b70e2;
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .user-btn-edit:hover {
      box-shadow: 6px 6px 10px #d1d9e6, -6px -6px 10px #f9f9f9;
      transform: scale(0.985);
      transition: 0.25s;
    }

    .user-btn-cancel {
      width: 82%;
      height: 40px;
      border: none;
      border-radius: 20px;
      background-color: #7d7c7c;
      color: white;
      font-size: 16px;
      cursor: not-allowed;
      box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .user-btn-edit,
    .user-btn-cancel {
      transition: background-color 0.3s, color 0.3s;
    }

    .user-btn-cancel.enabled {
      background-color: #c7d1e1 !important;
      /* 红色 */
      cursor: pointer !important;
    }



    /* 选择是否是他人可见的文件夹 */
    .user-visible {
      grid-area: visible;
      position: relative;
      background-color: #ecf0f3;
      box-shadow: -5px 5px 2px #f9f9f9;
      border-radius: 12px 0 0 12px;
    }

    /* 左侧选择是否是可见的文件夹和右侧文件夹中间的圆角 */
    .user-corner {
      position: absolute;
      top: -27px;
      right: -5px;
      /* 取决于圆角大小 */
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 3;
      background: url('data:image/svg+xml;utf8,<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" fill="%23ecf0f3"/><circle cx="32" cy="0" r="32" fill="white"/></svg>') no-repeat center/cover;
      transform: scaleX(-1) scale(0.7);
    }

    /* 右侧文件夹部分 */
    .user-files {
      grid-area: files;
      background-color: #ecf0f3;
      box-shadow: 5px 5px 10px #f9f9f9;
      border-radius: 12px 12px 12px 0;
    }
  </style>
</head>

<body>
  <!-- 导航栏容器 -->
  <div id="navbar"></div>
  <!-- 主体内容 -->
  <div class="user-main">
    <!-- 用户资料卡片 -->
    <div class="user-basic-card">
      <div class="user-avatar" id="user-avatar">
        <img id="user-avatar-img" src="../assets/default-avatar.png" alt="用户头像" />
        <div class="avatar-tip">点击更换头像</div>
        <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" />
      </div>
      <div class="user-info">
        <div id="username-span" class="username-span">昵称:</div>
        <div id="username-real" class="username-real">用户名</div>
      </div>
      <!-- 联系方式 -->
      <div class="user-info">
        <div class="username-span">邮箱:</div>
        <div class="username-real" id="user-email-detail">用户邮箱</div>
      </div>
      <div class="user-info">
        <div class="username-span">电话:</div>
        <div class="username-real" id="user-phone-detail">用户电话</div>
      </div>
      <!-- 修改按钮 -->
      <button id="edit-button" class="user-btn-edit">修改个人信息</button>
      <button id="cancel-button" class="user-btn-cancel">取消修改</button>
    </div>
    <!-- 选择是否他人可见，暂不开发 -->
    <div class="user-visible">
      <div class="user-corner"></div>
    </div>
    <!-- 文件部分，暂不开发 -->
    <div class="user-files">
    </div>
  </div>
  <script>
    // 加载导航栏
    document.addEventListener('DOMContentLoaded', function () {
      fetch('../navbar/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar').innerHTML = html;
          // 动态加载navbar.js
          var script = document.createElement('script');
          script.src = '../navbar/navbar.js';
          script.onload = function () {
            // navbar.js 加载完成后执行初始化
            initNavbarActive();
          };
          document.body.appendChild(script);
        });
    });

    // 更换用户头像逻辑
    const avatarDiv = document.getElementById('user-avatar');
    const avatarImg = document.getElementById('user-avatar-img');
    const avatarInput = document.getElementById('avatar-file-input');
    avatarDiv.addEventListener('click', function () {
      avatarInput.click();
    });
    avatarInput.addEventListener('change', function (e) {
      console.log('文件选择变化');
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const base64 = evt.target.result;
        // 预览头像
        avatarImg.src = base64;
        let user = JSON.parse(localStorage.getItem('user') || '{}');
        console.log(user.token)
        fetch(`http://${ip}/user/updateAvatar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'token': `${user.token}` },
          body: JSON.stringify({ id: user.id, image: base64 })
        }).then(res => res.json())
          .then(data => {
            if (data && data.code === 1 && data.data) {
              // 更新本地 user 的 avatarURL
              user.avatarURL = data.data;
              localStorage.setItem('user', JSON.stringify(user));
            }
          });
      };
      reader.readAsDataURL(file);
    });
    // 加载用户信息
    window.onload = function () {
      let user = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('username-real').textContent = user.userName || '用户名';
      document.getElementById('user-email-detail').textContent = user.email || '用户邮箱';
      document.getElementById('user-phone-detail').textContent = user.phone || '用户电话';
      document.getElementById('user-avatar-img').src = user.avatarURL || '../assets/default-avatar.png';
    };
    // 用户信息编辑逻辑
    let isEditing = false;
    let user = JSON.parse(localStorage.getItem('user') || '{}');
    let originName = user.userName || '用户名';
    let originPhone = user.phone || '用户电话';
    const editBtn = document.getElementById('edit-button');
    const cancelBtn = document.getElementById('cancel-button');
    const nameDiv = document.getElementById('username-real');
    const phoneDiv = document.getElementById('user-phone-detail');
    // 编辑用户信息，进入编辑模式，退出编辑模式
    function enterEditMode() {
      isEditing = true;
      // 先让昵称、电话、按钮文字同时退格动画
      let finished = 0;
      function checkAllDone() {
        finished++;
        if (finished === 3) {
          // 动画结束后，替换为input和新按钮内容
          nameDiv.innerHTML = `<input id="input-username" type="text" value="${originName}" style="width:90%;height:70%;font-size:18px;border:none;background:transparent;outline:none;">`;
          phoneDiv.innerHTML = `<input id="input-phone" type="text" value="${originPhone}" style="width:90%;height:70%;font-size:18px;border:none;background:transparent;outline:none;">`;
          editBtn.textContent = '保存修改';
          cancelBtn.disabled = false;
          cancelBtn.classList.add('enabled');
        }
      }
      animateTextChange(nameDiv, nameDiv.textContent, '', checkAllDone);
      animateTextChange(phoneDiv, phoneDiv.textContent, '', checkAllDone);
      animateTextChange(editBtn, editBtn.textContent, '保存信息', checkAllDone);
    }
    function exitEditMode(save) {
      isEditing = false;
      let newName = originName;
      let newPhone = originPhone;
      if (save) {
        newName = document.getElementById('input-username').value;
        newPhone = document.getElementById('input-phone').value;
        originName = newName;
        originPhone = newPhone;
        let user = JSON.parse(localStorage.getItem('user') || '{}');
        fetch(`http://${ip}/user/updateInfo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'token': `${user.token}` },
          body: JSON.stringify({ id: user.id, userName: newName, phone: newPhone })
        }).then(res => res.json())
          .then(data => {
            if (data && data.code === 1) {
              // 更新本地 user 的 userName 和 phone
              let user = JSON.parse(localStorage.getItem('user') || '{}');
              user.userName = newName;
              user.phone = newPhone;
              localStorage.setItem('user', JSON.stringify(user));
            }
          });
      }
      // 并行动画，全部动画完再恢复按钮
      let finished = 0;
      function checkAllDone() {
        finished++;
        if (finished === 3) {
          editBtn.textContent = '修改个人信息';
          cancelBtn.disabled = true;
          cancelBtn.classList.remove('enabled');
        }
      }
      animateTextChange(nameDiv, nameDiv.textContent, newName, checkAllDone);
      animateTextChange(phoneDiv, phoneDiv.textContent, newPhone, checkAllDone);
      animateTextChange(editBtn, editBtn.textContent, '修改个人信息', checkAllDone);
    }
    //  编辑功能对应的两个按钮
    editBtn.onclick = function () {
      if (!isEditing) {
        enterEditMode();
      } else {
        exitEditMode(true);
      }
    };
    cancelBtn.onclick = function () {
      if (isEditing) {
        exitEditMode(false);
      }
    };
    // 打字机特效
    function animateTextChange(element, oldText, newText, callback) {
      // 1. 退格动画
      let i = oldText.length;
      function erase() {
        if (i > 0) {
          element.textContent = oldText.slice(0, --i);
          setTimeout(erase, 40); // 速度可调
        } else {
          // 2. 打字动画
          let j = 0;
          function type() {
            if (j <= newText.length) {
              element.textContent = newText.slice(0, j++);
              setTimeout(type, 40);
            } else if (callback) {
              callback();
            }
          }
          type();
        }
      }
      erase();
    }
    // 初始取消按钮不可用
    cancelBtn.disabled = true;
  </script>
</body>

</html>
