<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="../js/ip.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* 字体无法选中 */
      user-select: none;
    }

    body {
      width: 100%;
      height: 100vh;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      background-color: #ffffff;
      color: #a0a5a8;
    }

    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .shell {
      position: relative;
      width: 1000px;
      min-width: 1000px;
      min-height: 600px;
      height: 600px;
      padding: 25px;
      background-color: #ecf0f3;
      box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
      border-radius: 12px;
      overflow: hidden;
    }

    /* 设置响应式 */
    @media (max-width: 1200px) {
      .shell {
        transform: scale(0.7);
      }
    }

    @media (max-width: 1000px) {
      .shell {
        transform: scale(0.6);
      }
    }

    @media (max-width: 800px) {
      .shell {
        transform: scale(0.5);
      }
    }

    @media (max-width: 600px) {
      .shell {
        transform: scale(0.4);
      }
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      width: 600px;
      height: 100%;
      padding: 25px;
      background-color: #ecf0f3;
      transition: 1.25s;
    }

    .form {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .iconfont {
      margin: 0 5px;
      border: rgba(0, 0, 0, 0.5) 2px solid;
      border-radius: 50%;
      font-size: 25px;
      padding: 3px;
      opacity: 0.5;
      transition: 0.1s;
    }

    .iconfont:hover {
      opacity: 1;
      transition: 0.15s;
      cursor: pointer;
    }

    .form_input {
      width: 350px;
      height: 40px;
      margin: 4px 0;
      padding-left: 25px;
      font-size: 13px;
      letter-spacing: 0.15px;
      border: none;
      outline: none;
      background-color: #ecf0f3;
      transition: 0.25s ease;
      border-radius: 8px;
      box-shadow: inset 2px 2px 4px #d1d9e6, inset -2px -2px 4px #f9f9f9;
    }

    .Code_text {
      width: 200px;
      height: 40px;
      margin: 4px 0;
      padding-left: 25px;
      font-size: 13px;
      letter-spacing: 0.15px;
      border: none;
      outline: none;
      background-color: #ecf0f3;
      transition: 0.25s ease;
      border-radius: 8px;
      box-shadow: inset 2px 2px 4px #d1d9e6, inset -2px -2px 4px #f9f9f9;
    }

    .Code_button {
      width: 120px;
      height: 40px;
      margin-left: 20px;
      font-size: 13px;
      letter-spacing: 0.15px;
      border: none;
      outline: none;
      background-color: #4B70E2;
      color: #f9f9f9;
      box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #f9f9f9;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .Code_button:hover {
      box-shadow: 6px 6px 10px #d1d9e6, -6px -6px 10px #f9f9f9;
      transform: scale(0.985);
      transition: 0.25s;
    }

    .form_input:focus {
      box-shadow: inset 4px 4px 4px #d1d9e6, inset -4px -4px 4px #f9f9f9;
    }

    .form_span {
      margin-top: 30px;
      margin-bottom: 12px;
    }

    .form_link {
      color: #181818;
      font-size: 15px;
      margin-top: 25px;
      border-bottom: 1px solid #a0a5a8;
      line-height: 2;
    }

    .title {
      font-size: 34px;
      font-weight: 700;
      line-height: 3;
      color: #181818;
      letter-spacing: 10px;
    }

    .description {
      font-size: 14px;
      letter-spacing: 0.25px;
      text-align: center;
      line-height: 1.6;
    }

    .button {
      width: 180px;
      height: 50px;
      border-radius: 25px;
      margin-top: 50px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.15px;
      background-color: #4B70E2;
      color: #f9f9f9;
      box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #f9f9f9;
      border: none;
      outline: none;
    }

    .a-container {
      z-index: 100;
      left: calc(100% - 600px);
    }

    .b-container {
      left: calc(100% - 600px);
      z-index: 0;
    }

    .switch {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 400px;
      padding: 50px;
      z-index: 200;
      transition: 1.25s;
      background-color: #ecf0f3;
      overflow: hidden;
      box-shadow: 4px 4px 10px #d1d9e6, -4px -4px 10px #d1d9e6;
    }

    .switch_circle {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background-color: #ecf0f3;
      box-shadow: inset 8px 8px 12px #b8bec7, inset -8px -8px 12px #fff;
      bottom: -60%;
      left: -60%;
      transition: 1.25s;
    }

    .switch_circle-t {
      top: -30%;
      left: 60%;
      width: 300px;
      height: 300px;
    }

    .switch_container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: absolute;
      width: 400px;
      padding: 50px 55px;
      transition: 1.25s;
    }

    .switch_button {
      cursor: pointer;
    }

    .switch_button:hover,
    .submit:hover {
      box-shadow: 6px 6px 10px #d1d9e6, -6px -6px 10px #f9f9f9;
      transform: scale(0.985);
      transition: 0.25s;
    }

    .switch_button:active,
    .switch_button:focus {
      box-shadow: 2px 2px 6px #d1d9e6, -2px -2px 6px #f9f9f9;
      transform: scale(0.97);
      transition: 0.25s;
    }

    .is-txr {
      left: calc(100% - 400px);
      transition: 1.25s;
      transform-origin: left;
    }

    .is-txl {
      left: 0;
      transition: 1.25s;
      transform-origin: right;
    }

    .is-z {
      z-index: 200;
      transition: 1.25s;
    }

    .is-hidden {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      transition: 1.25s;
    }

    .is-gx {
      animation: is-gx 1.25s;
    }

    @keyframes is-gx {
      0% {
        width: 400px;
      }

      10% {
        width: 400px;
      }

      30% {
        width: 500px;
      }

      50% {
        width: 500px;
      }

      100% {
        width: 400px;
      }
    }
  </style>
</head>

<body>
  <!--  提示框，代替alert -->
  <div id="toast"
    style="display:none;position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 32px;border-radius:6px;z-index:9999;font-size:16px;">
  </div>
  <!--  导航栏容器 -->
  <div id="navbar"></div>
  <!--  主体内容 -->
  <div class="center-container">
    <div class="shell">
      <div class="container a-container" id="a-container">
        <form action="" method="" class="form" id="a-form">
          <h2 class="form_title title">创建账号/重置密码</h2>
          <span class="form_span">若邮箱未注册过,则为注册;若邮箱已注册过,则为重置密码</span>
          <input type="email" class="form_input" placeholder="邮箱">
          <input type="password" class="form_input" placeholder="密码，至少6位">
          <div style="display: flex; align-items: center; justify-content: center; width: 100%;">
            <input type="text" class="Code_text" placeholder="验证码">
            <button class="Code_button" id="codeBtn">获取验证码</button>

          </div>
          <button class="form_button button submit">注册</button>
        </form>
      </div>

      <div class="container b-container is-z" id="b-container">
        <form action="" method="" class="form" id="b-form">
          <h2 class="form_title title">登录</h2>

          <span class="form_span">登录方式为电子邮箱登录</span>
          <input type="email" class="form_input" placeholder="邮箱">
          <input type="password" class="form_input" placeholder="密码">
          <button class="form_button button submit">登录</button>
        </form>
      </div>

      <div class="switch" id="switch-cnt">
        <div class="switch_circle"></div>
        <div class="switch_circle switch_circle-t"></div>

        <div class="switch_container" id="switch-c1">
          <h2 class="switch_title title" style="letter-spacing: 0;">Hello Friend!</h2>
          <p class="switch_description description">去注册一个账号，或者重置密码</p>
          <button class="switch_button button switch-btn">去注册/重置密码</button>
        </div>

        <div class="switch_container is-hidden" id="switch-c2">
          <h2 class="switch_title title" style="letter-spacing: 0;">Welcome Back!</h2>
          <p class="switch_description description">已经有账号了嘛，去登入账号吧！！！</p>
          <button class="switch_button button switch-btn">去登录</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // 加载导航栏
    document.addEventListener('DOMContentLoaded', function () {
      fetch('../navbar/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar').innerHTML = html;
          // 动态加载navbar.js
          var script = document.createElement('script');
          script.src = '../navbar/navbar.js';
          script.onload = function () {
            // navbar.js 加载完成后执行初始化
            initNavbarActive();
          };
          document.body.appendChild(script);
        });
    });


    let switchCtn = document.querySelector("#switch-cnt");
    let switchC1 = document.querySelector("#switch-c1");
    let switchC2 = document.querySelector("#switch-c2");
    let switchCircle = document.querySelectorAll(".switch_circle");
    let switchBtn = document.querySelectorAll(".switch-btn");
    let aContainer = document.querySelector("#a-container");
    let bContainer = document.querySelector("#b-container");
    let allButtons = document.querySelectorAll(".submit");

    // 阻止表单默认提交行为
    let getButtons = (e) => e.preventDefault();

    // 表单切换动画函数
    let changeForm = (e) => {
      // 添加动画效果
      switchCtn.classList.add("is-gx");
      setTimeout(function () {
        switchCtn.classList.remove("is-gx");
      }, 1500);

      // 切换容器位置
      switchCtn.classList.toggle("is-txr");
      if (switchCircle.length >= 2) {
        switchCircle[0].classList.toggle("is-txr");
        switchCircle[1].classList.toggle("is-txr");
      }

      // 切换显示/隐藏状态
      switchC1.classList.toggle("is-hidden");
      switchC2.classList.toggle("is-hidden");

      // 切换左右布局
      aContainer.classList.toggle("is-txl");
      bContainer.classList.toggle("is-txl");
      bContainer.classList.toggle("is-z");
    }

    // 提示框函数
    function showToast(msg, duration = 2000) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.display = 'none';
      }, duration);
    }
    // 发送验证码函数
    let sendVerificationCode = () => {
      showToast('验证码已发送，请查收！');
      // 在这里添加发送验证码的逻辑
      fetch(`http://${ip}/user/sendCode`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: document.querySelector('.a-container .form_input[type="email"]').value
        })
      });
      //倒计时
      let btn = document.getElementById("codeBtn");
      let count = 60;
      btn.disabled = true;
      btn.style.backgroundColor = "#cccccc";
      btn.textContent = `${count}秒后重发`;
      let timer = setInterval(function () {
        count--;
        btn.textContent = `${count}秒后重发`;
        if (count === 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.style.backgroundColor = "";
          btn.textContent = '获取验证码';
        }
      }, 1000);
    }
    document.getElementById("codeBtn").addEventListener("click", function (e) {
      e.preventDefault(); //阻止默认行为
      sendVerificationCode(); //调用发送验证码函数
    });

    //注册按钮事件
    let registerButton = () => {
      const password = document.querySelector('.a-container .form_input[type="password"]').value;
      if (password.length < 6) {
        showToast('密码至少6位！');
        return;
      }
      fetch(`http://${ip}/user/register`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: document.querySelector('.a-container .form_input[type="email"]').value,
          password: password,
          code: document.querySelector('.a-container .Code_text').value
        })
      }).then(response => response.json())
        .then(data => {
          if (data.code === 1) {
            // 存储用户信息到本地存储
            localStorage.setItem('user', JSON.stringify(data.data));
            //跳转到主页
            window.location.href = "./create.html";
          } else {
            showToast('注册失败：' + data.message);
          }
        })
        .catch(error => {
          showToast('注册请求出错！');
          console.error('Error:', error);
        });
    }
    document.querySelector(".a-container .submit").addEventListener("click", function (e) {
      e.preventDefault(); //阻止默认行为
      registerButton();
    });

    //登录按钮事件
    let loginButton = () => {
      fetch(`http://${ip}/user/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: document.querySelector('.b-container .form_input[type="email"]').value,
          password: document.querySelector('.b-container .form_input[type="password"]').value
        })
      }).then(response => response.json())
        .then(data => {
          if (data.code === 1) {
            // 存储用户信息到本地存储
            localStorage.setItem('user', JSON.stringify(data.data));
            //跳转到主页
            window.location.href = "./create.html";
          } else {
            showToast('登录失败：' + data.message);
          }
        })
        .catch(error => {
          showToast('登录请求出错！');
          console.error('Error:', error);
        });
    }
    document.querySelector(".b-container .submit").addEventListener("click", function (e) {
      e.preventDefault(); //阻止默认行为
      loginButton();
    });
    // 初始化事件监听
    let shell = () => {
      for (let i = 0; i < allButtons.length; i++) {
        allButtons[i].addEventListener("click", getButtons);
      }
      for (let i = 0; i < switchBtn.length; i++) {
        switchBtn[i].addEventListener("click", changeForm);
      }
    }
    // 页面加载完成后初始化
    window.addEventListener("load", shell);
  </script>
</body>

</html>
